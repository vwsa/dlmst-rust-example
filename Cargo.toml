[package]
name = "dlmst"
default-run = "dlmst"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Brief AI-implemented, unoptimized Rust example of DLMST certificate mechanisms"
license = "MIT"

[dependencies]
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = { version = "0.9.2", features = ["small_rng"] }

[dev-dependencies]
proptest = "1"
